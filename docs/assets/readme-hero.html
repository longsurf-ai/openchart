<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenChart README hero</title>
    <link rel="stylesheet" href="../../app/src/styles/fonts.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #fff;
        color: #18181b;
        font-family: Inter, sans-serif;
      }
      main {
        width: 1800px;
        padding: 56px 28px 32px;
      }
      header {
        margin-bottom: 48px;
        text-align: center;
      }
      h1 {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        margin: 0;
        font-size: 72px;
        font-weight: 600;
        letter-spacing: -3px;
        line-height: 1.15;
      }
      .logo {
        width: 70px;
        height: 70px;
      }
      p {
        margin: 24px 0 0;
        color: #52525b;
        font-size: 29px;
        line-height: 1.5;
      }
      .dashboard {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #27272a;
        border-radius: 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>
          <img
            class="logo"
            src="../../platform/desktop/assets/logo.svg"
            alt=""
          />
          OpenChart
        </h1>
        <p>Trade with charts, alerts, and your AI agents.</p>
      </header>
      <img
        class="dashboard"
        src="dashboard-preview.png"
        alt="OpenChart Desktop with SOXX and Bitcoin charts, indicators, the Tea editor, and an AI agent conversation."
        width="3836"
        height="2102"
      />
    </main>
  </body>
</html>
