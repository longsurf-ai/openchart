name: Desktop Windows

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "platform/desktop/**"
      - "server/**"
      - "common/models/**"
      - "app/**"
      - "bun.lock"
      - "justfile"
      - ".node-version"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  OPENCHART_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: desktop-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      VITEST_MIN_FORKS: "2"
      VITEST_MAX_FORKS: "2"
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ env.OPENCHART_SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: vendor/tea/package-lock.json
      - name: Install Tea's supported npm version
        run: npm install --global npm@11.11.1
      - uses: extractions/setup-just@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies using Git Bash
        id: install
        run: just install --frozen-lockfile
      - name: Verify platform contracts and native integrations
        run: just test-core platform/desktop/src/targets.test.ts platform/desktop/src/main.test.ts platform/desktop/src/squirrel.test.ts platform/desktop/scripts platform/desktop/tests/native-executable.test.ts server/models/onboarding server/agent/workflow/compile-workflow.test.ts common/models/src/providers/antigravity common/models/src/providers/claude-code/adapter/environment.test.ts
      - name: Build unsigned Windows installer and update packages
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        id: build
        run: |
          version=$(node -p "require('./platform/desktop/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          just desktop-release win32-x64 unsigned
      - name: Probe pinned Antigravity sign-in with ConPTY
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          OPENCHART_WINDOWS_RUNTIME_PROBE_REPORT: platform/desktop/.artifacts/antigravity-windows-probe.json
        run: just desktop-windows-probe
      - name: Verify relocated production package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          version=$(node -p "require('./platform/desktop/package.json').version")
          executable=$(cygpath -w "$PWD/platform/desktop/out/$version/OpenChart-win32-x64/OpenChart.exe")
          just desktop-smoke "$executable" production
      - name: Retain installer and receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenChart-win32-x64-unsigned-${{ env.OPENCHART_SOURCE_SHA }}
          path: platform/desktop/out/release/${{ steps.build.outputs.version }}/win32-x64/
          if-no-files-found: warn
          retention-days: 30
      - name: Retain smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-evidence-${{ env.OPENCHART_SOURCE_SHA }}
          include-hidden-files: true
          path: |
            platform/desktop/.artifacts/*.json
            platform/desktop/.artifacts/*.png
            platform/desktop/.artifacts/*.txt
          if-no-files-found: warn
          retention-days: 14
